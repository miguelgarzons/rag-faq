
name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloud-run-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ vars.CLOUD_RUN_REGION || 'us-central1' }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'rag-faq-api' }}
  REPOSITORY: rag-faq-repo
  IMAGE: ${{ vars.CLOUD_RUN_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rag-faq-repo/${{ vars.CLOUD_RUN_SERVICE || 'rag-faq-api' }}:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth (Artifact Registry)
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: docker build -t "$IMAGE" .

      - name: Push Docker image
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --set-env-vars "USE_CLOUD_SQL_CONNECTOR=true" \
            --set-env-vars "INSTANCE_CONNECTION_NAME=${{ vars.INSTANCE_CONNECTION_NAME || 'it-fab-soft-sandbox-t:us-central1:faq-rag' }}" \
            --set-env-vars "DB_IP_TYPE=${{ vars.DB_IP_TYPE || 'PUBLIC' }}" \
            --set-env-vars "DB_USER=${{ secrets.DB_USER }}" \
            --set-env-vars "DB_PASS=${{ secrets.DB_PASS }}" \
            --set-env-vars "DB_NAME=${{ secrets.DB_NAME }}" \
            --set-env-vars "GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}" \
            --set-env-vars "GCP_MODEL_NAME=${{ vars.GCP_MODEL_NAME || 'gemini-2.5-pro' }}" \
            --set-env-vars "GCP_LOCATION=${{ vars.GCP_LOCATION || 'us-central1' }}" \
            --set-env-vars "ENABLE_VERTEX_AI=${{ vars.ENABLE_VERTEX_AI || 'true' }}" \
            --quiet

      - name: Show service URL
        run: |
          URL=$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --format='value(status.url)')
          echo "Cloud Run URL: $URL"
